# Targets the evergreen latest release of ruby
name: Current MRI

permissions:
  contents: read

env:
  K_SOUP_COV_DO: false

on:
  push:
    branches:
      - 'main'
      - '*-stable'
    tags:
      - '!*' # Do not execute on tags
  pull_request:
    branches:
      - '*'
  # Allow manually triggering the workflow.
  workflow_dispatch:

# Cancels all previous workflow runs for the same branch that have not yet completed.
concurrency:
  # The concurrency group contains the workflow name and the branch name.
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    if: "github.event_name != 'push' || (!contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.head_commit.message, '[skip ci]'))"
    name: Specs ${{ matrix.os }} ${{ matrix.ruby }}@${{ matrix.appraisal }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env: # $BUNDLE_GEMFILE must be set at job level, so it is set for all steps
      BUNDLE_GEMFILE: ${{ github.workspace }}/Appraisal.root.gemfile
    strategy:
      matrix:
        include:
          # Ruby 4.0
          - ruby: "ruby"
            appraisal: "current"
            os: ubuntu-latest
            exec_cmd: "kettle-test"
            rubygems: latest
            bundler: latest
          - ruby: "ruby"
            appraisal: "current"
            os: macos-latest
            exec_cmd: "kettle-test"
            rubygems: latest
            bundler: latest

    steps:
      - name: Remove eMudhra roots from the macOS CA bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          #!/bin/sh
          # Remove the eMudhra-related roots from the macOS system CA bundle.
          #
          # Apple's /etc/ssl/cert.pem still carries roots from the eMudhra incident, and the
          # developer tools Apple ships (git, curl, python3) read that file, so a network
          # attacker could tamper with downloads made during a release build. GitHub's macOS
          # runners are ephemeral, so removing the roots at job start needs no re-application
          # after OS updates. Reference: https://github.com/galadran/we-have-a-problem.com/issues/157
          #
          # It must run BEFORE the first step that downloads anything (actions/checkout runs
          # git), so the workflows inline this exact file. A contract test keeps them identical.
          #
          # Matching is by certificate subject so no fingerprints need to be guessed; every
          # removed certificate is printed with its SHA-256 fingerprint for the audit log, and
          # the script fails if any matching certificate is still present afterwards.
          #
          # Environment (for tests): CA_BUNDLE (default /etc/ssl/cert.pem), SUDO (default sudo).
          set -eu

          bundle="${CA_BUNDLE:-/etc/ssl/cert.pem}"
          sudo_cmd="${SUDO-sudo}"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          matches() {
            case "$1" in
              *"AAA Certificate Services"* | *"emSign ECC Root CA - G3"* | *[eE][mM]udhra*) return 0 ;;
              *) return 1 ;;
            esac
          }

          total="$(grep -c -- '-----BEGIN CERTIFICATE-----' "$bundle")"
          [ "$total" -ge 100 ] || { echo "refusing to edit $bundle: only $total certificates" >&2; exit 1; }

          awk -v dir="$work" '
            /-----BEGIN CERTIFICATE-----/ { if (out != "") close(out); n++; out = dir "/c" n ".pem" }
            out != "" { print > out }
          ' "$bundle"

          : > "$work/clean.pem"
          removed=0
          i=1
          while [ "$i" -le "$total" ]; do
            file="$work/c$i.pem"
            subject="$(openssl x509 -in "$file" -noout -subject 2>/dev/null || true)"
            if [ -n "$subject" ] && matches "$subject"; then
              fingerprint="$(openssl x509 -in "$file" -noout -fingerprint -sha256)"
              echo "removing: $subject ($fingerprint)"
              removed=$((removed + 1))
            else
              cat "$file" >> "$work/clean.pem"
            fi
            i=$((i + 1))
          done

          if [ "$removed" -gt 0 ]; then
            $sudo_cmd tee "$bundle" < "$work/clean.pem" > /dev/null
          fi

          # Verify what is on disk now, not what we intended to write.
          after="$(grep -c -- '-----BEGIN CERTIFICATE-----' "$bundle")"
          [ "$after" -eq $((total - removed)) ] || { echo "certificate count mismatch: $after != $total - $removed" >&2; exit 1; }
          rm -f "$work"/c*.pem
          awk -v dir="$work" '
            /-----BEGIN CERTIFICATE-----/ { if (out != "") close(out); n++; out = dir "/v" n ".pem" }
            out != "" { print > out }
          ' "$bundle"
          for file in "$work"/v*.pem; do
            subject="$(openssl x509 -in "$file" -noout -subject 2>/dev/null || true)"
            if [ -n "$subject" ] && matches "$subject"; then
              echo "still trusted after cleanup: $subject" >&2
              exit 1
            fi
          done
          echo "CA bundle $bundle: $total certificates, removed $removed, $after remain."

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Ruby & RubyGems
        uses: appraisal-rb/setup-ruby-flash@6f8ad36ba7488db591541483afb5464d01e8861b # v2.14
        with:
          ruby-version: ${{ matrix.ruby }}
          rubygems: ${{ matrix.rubygems }}
          bundler: ${{ matrix.bundler }}
          bundler-cache: true
          manual-compatibility-bundle: true
          gem-install-retries: 7

      - name: "[Attempt 1] Appraisal for ${{ matrix.ruby }}@${{ matrix.appraisal }}"
        id: bundleAppraisalAttempt1
        run: bundle exec appraisal ${{ matrix.appraisal }} install
        # Continue to the next step on failure
        continue-on-error: true

      # Effectively an automatic retry of the previous step.
      - name: "[Attempt 2] Appraisal for ${{ matrix.ruby }}@${{ matrix.appraisal }}"
        id: bundleAppraisalAttempt2
        # If bundleAppraisalAttempt1 failed, try again here; Otherwise skip.
        if: ${{ steps.bundleAppraisalAttempt1.outcome == 'failure' }}
        run: |
          rm -f gemfiles/${{ matrix.appraisal }}.gemfile.lock
          rm -rf vendor/bundle "$HOME/.bundle/cache"
          bundle exec appraisal ${{ matrix.appraisal }} install

      - name: Restore RSpec status log
        if: "${{!env.ACT}}"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .rspec_status
          key: rspec-status-current-${{matrix.os}}-${{matrix.ruby}}-${{matrix.appraisal}}-${{hashFiles('**/Gemfile.lock','Appraisal.root.gemfile','gemfiles/**/*.gemfile')}}-${{github.run_id}}-${{github.run_attempt}}
          restore-keys: |
            rspec-status-current-${{matrix.os}}-${{matrix.ruby}}-${{matrix.appraisal}}-${{hashFiles('**/Gemfile.lock','Appraisal.root.gemfile','gemfiles/**/*.gemfile')}}-
            rspec-status-current-${{matrix.os}}-${{matrix.ruby}}-${{matrix.appraisal}}-

      - name: Tests for ${{ matrix.os }} ${{ matrix.ruby }} via ${{ matrix.exec_cmd }}
        run: bundle exec appraisal ${{ matrix.appraisal }} ${{ matrix.exec_cmd }}
